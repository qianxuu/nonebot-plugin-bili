[project]
name = "nonebot-plugin-bili"
version = "0.2.0"
description = "NoneBot2 插件：B 站视频解析与直播开播提醒"
readme = "README.md"
authors = [
    { name = "qianxu", email = "qianxuuuu@qq.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["nonebot", "nonebot2", "plugin", "bilibili", "bili", "onebot", "qq", "bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.14.1",
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot-plugin-apscheduler>=0.5.0",
    "nonebot2>=2.5.0",
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://github.com/qianxuu/nonebot-plugin-bili"
Documentation = "https://github.com/qianxuu/nonebot-plugin-bili#readme"
Repository = "https://github.com/qianxuu/nonebot-plugin-bili"
Issues = "https://github.com/qianxuu/nonebot-plugin-bili/issues"
Changelog = "https://github.com/qianxuu/nonebot-plugin-bili/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "twine>=6.1.0",
    "ty>=0.0.58",
]

[tool.uv.build-backend]
source-include = [
    "CHANGELOG.md",
    ".env.example",
    "tests/**",
    ".python-version",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.lint.isort]
length-sort = true
known-first-party = ["nonebot_plugin_bili"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
